# Memes Arcade - Render Blueprint (Infrastructure as Code)
#
# Everything in this file runs on Render's Free compute plan: one Node web
# service plus one Free Postgres database. No disk, no background worker, no
# second instance, and a single database (Render allows one Free Postgres per
# workspace).
# What "free" means here:
#   - 0.1 CPU / 512 MB, and the service spins down after 15 minutes with no
#     inbound traffic (the next visit waits ~1 minute for it to wake)
#   - the filesystem is ephemeral: data/ is rebuilt on every deploy, restart
#     *and* spin-down, so accounts reset - keep MEMES_ADMIN_PASS set
#   - 750 free instance hours per workspace per month: one always-awake
#     service fits (~730 h), a second one would trip the cap
#   - WebSockets, custom domains and managed TLS are included
#   - persistent disks and background workers are not (see docs/DEPLOY.md for
#     the paid upgrade snippets)
#   - Free Postgres is 1 GB and ONE per workspace, and it EXPIRES 30 days after
#     creation: Render gives 14 days' grace, then deletes it. Upgrade the
#     database in the dashboard before then to keep accounts. The app notices a
#     missing database, says so, and falls back to the ephemeral file instead of
#     refusing to start.
#
# Deploy: push this repo to GitHub, then in Render choose
#   New -> Blueprint -> pick the repo -> Apply.
# Render reads this file and prompts for the values marked `sync: false`.
# Spec: https://render.com/docs/blueprint-spec
# `npm run blueprintcheck` proves this file only ever asks for free resources.
services:
  - type: web
    name: memes-arcade
    runtime: node
    plan: free
    autoDeployTrigger: commit
    # `pg` is the one runtime dependency (the store). The build installs it and
    # runs the project's own checks, so a broken engine - or a blueprint edit
    # that starts asking for something paid - fails the deploy instead of the
    # players.
    buildCommand: npm install && npm run check && npm run dbcheck && npm run blueprintcheck
    startCommand: npm start
    healthCheckPath: /api/health
    # No `maxShutdownDelaySeconds:` - Render's validator refuses it on a free
    # instance ("max shutdown delay is not supported for free tier services"),
    # even though the published schema allows the field, so a Blueprint that
    # carries it cannot be applied at all. SIGTERM still reaches the server and
    # it still closes its store - it just gets the free tier's own grace window
    # instead of one it asked for. On a paid instance, put the line back and
    # check with `MEMES_BLUEPRINT_PAID=1 npm run blueprintcheck`.
    # No `region:` - Render uses your workspace's default. Add
    # `region: frankfurt` (or ohio / virginia / singapore) before the first
    # deploy if you want it closer to your players: the value is permanent.
    # No `numInstances:` - a free instance can't scale, and rooms, parties and
    # matches live in this process's memory, so exactly one is what the app wants.
    envVars:
      # Render injects PORT, NODE_ENV=production and RENDER_EXTERNAL_URL, so
      # invite links already point at the right host - none of those go here.
      - key: NODE_VERSION
        value: 24.16.0
      # Your owner account. Render asks for the password during the Blueprint
      # flow and it is never stored in this file. Set it even if you are just
      # trying things out: a free service spins down, and on the next wake the
      # generated password in data/ADMIN-CREDENTIALS.txt is gone with it.
      - key: MEMES_ADMIN_PASS
        sync: false
      - key: MEMES_ADMIN_USER
        value: memegodmidas
      # The Discord bot's token: Developer Portal -> your application -> Bot ->
      # Reset Token. The value can never live in this file (`sync: false`), so
      # Render asks for it on the first Blueprint apply; on a service that
      # already exists, add it under Environment. Without it the site runs
      # perfectly and the bot stays off - /api/health reports exactly that as
      # `"bot":{"running":false,"reason":"no DISCORD_TOKEN ..."}`.
      - key: DISCORD_TOKEN
        sync: false
      # Keeps the Discord bot's shared secret stable across redeploys, because
      # data/bot-secret.txt is wiped. The site starts the bot itself when
      # DISCORD_TOKEN is set on this service; to run the bot on your own PC
      # instead, set MEMES_BOT_AUTOSTART=off - see docs/DEPLOY.md ("The
      # Discord bot").
      - key: MEMES_BOT_SECRET
        generateValue: true
      # The Blueprint's own Postgres. Render fills this from the database below
      # (internal connection string), so no password ever lives in this file.
      # The app keeps its whole store in one JSONB row there - accounts, ideas,
      # rooms, bot memory - instead of the ephemeral data/db.json.
      - key: DATABASE_URL
        fromDatabase:
          name: memes-arcade-db
          property: connectionString
      # Close registrations once your friends have signed up:
      # - key: MEMES_REGISTRATIONS
      #   value: closed

databases:
  - name: memes-arcade-db
    plan: free
    # No `diskSizeGB:` - Render refuses it on a free database ("plan Free cannot
    # change disk size"), even when it names the 1 GB the free plan is fixed at.
    # Omitted, a Free Postgres comes up at 1 GB on its own. The field is on the
    # free-tier-rejected list in tools/blueprint-check.mjs, so putting it back
    # fails the build instead of the Blueprint apply.
    # No `postgresMajorVersion:` - Render's default (18) is what we want, and
    # the version cannot be changed after the database is created.
    # No `ipAllowList:` - the app connects over Render's private network from
    # the service in the same workspace, so no external access is needed.
    postgresMajorVersion: "18"
